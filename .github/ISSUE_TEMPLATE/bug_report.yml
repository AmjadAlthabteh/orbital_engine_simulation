name: Bug report
description: Report a reproducible problem in the simulation
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Launch the simulation
        2. ...
    validations:
      required: true
  - type: input
    attributes:
      label: Build and environment
      description: Commit, OS, compiler, GPU, and graphics driver
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Attach any output that helps explain the failure.
